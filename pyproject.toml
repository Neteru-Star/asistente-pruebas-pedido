[tool.ruff]
# 100 caracteres: las rutas y mensajes de las pruebas pasan de 88 y partirlas no aporta claridad
line-length = 100

[tool.ruff.lint]
# E estilo, F errores, B errores probables, S seguridad (bandit)
select = ["E", "F", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# assert es la forma normal de comprobar en pytest; nunca se ejecuta con -O
"tests/*" = ["S101"]
